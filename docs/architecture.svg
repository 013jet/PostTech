<?xml version="1.0" encoding="UTF-8"?>
<svg class="overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">JanaМен архитектурасы: қазір және болашақ</title>
<desc id="arch-desc">Қолданыста React браузері Fastify API-іне, API PostgreSQL-ге жүгінеді. AI Jana браузердегі анықтамалықты оқиды. Жоспарланған worker PostgreSQL кезегін өңдейді, 1С:ЗУП-тен кадрды оқиды және Documentolog-қа құжат жіберіп, тексерілген мәртебені қабылдайды. Үзік шекаралар әлі қосылмаған бөліктерді білдіреді.</desc>
<style>
svg{--svg-bg:var(--surface,#fff);--svg-text:var(--text,#0f1a26);--svg-dim:var(--text-dim,#4d6074);--svg-border:var(--border-bright,#818f9e);--svg-accent:var(--accent,#246b53);font-family:'Segoe UI','IBM Plex Sans',sans-serif;font-size:17px}
.current-only{display:none}
.arch-bound{fill:none;stroke:#818f9e;stroke-width:1;stroke-dasharray:6 5}.arch-node rect,.arch-node path,.arch-node ellipse{fill:#ffffff;stroke:#818f9e;stroke-width:1.75}.arch-node .planned-box{stroke-dasharray:6 5}.arch-node text{fill:#0f1a26;font-size:18px;font-weight:600}.arch-node .sub{fill:#4d6074;font-size:14px;font-weight:400}.arch-node .kind,.arch-zone{fill:#4d6074;font-size:13px;font-family:'Consolas',monospace;font-weight:400}.arch-edge{fill:none;stroke:#4d6074;stroke-width:1.75;marker-end:url(#arch-arrow)}.arch-edge.async{stroke-dasharray:6 5}.arch-label{fill:#4d6074;font-size:14px;paint-order:stroke;stroke:#ffffff;stroke-width:5;stroke-linejoin:round}.arch-node.active rect,.arch-node.active path,.arch-node.active ellipse{stroke:#246b53;stroke-width:2.75}.arch-node.active text{fill:#246b53}.arch-callout{fill:#246b53;font-size:14px}
@media(prefers-color-scheme:dark){svg{--svg-bg:var(--surface,#132031);--svg-text:var(--text,#e3ecf5);--svg-dim:var(--text-dim,#92a6bb);--svg-border:var(--border-bright,#596b87);--svg-accent:var(--accent,#91d7b8)}}
</style>
