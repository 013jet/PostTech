  <g class="arch-node" data-ref="zup"><rect class="planned-box" x="795" y="330" width="210" height="105" rx="4"/><text class="kind" x="811" y="353">БОЛАШАҚ · тек оқу</text><text x="811" y="382">1С:ЗУП</text><text class="sub" x="811" y="405">Кадр · ұйым · басшы</text><text class="sub" x="811" y="425">HTTP JSON / OData*</text></g>
  <g class="arch-node" data-ref="documentolog"><rect class="planned-box" x="795" y="500" width="210" height="105" rx="4"/><text class="kind" x="811" y="523">БОЛАШАҚ · өнімді келісу</text><text x="811" y="552">Documentolog</text><text class="sub" x="811" y="575">Құжат · қол қою · мәртебе</text><text class="sub" x="811" y="596">API + расталған callback*</text></g>
  <text class="arch-zone" x="300" y="616">* Нақты API мен қауіпсіздік тәсілі провайдермен келісіледі.</text>
</g>
<g class="current-only"><text class="arch-callout" x="300" y="340">Сыртқы интеграциялар қазір қосылмаған.</text><text class="arch-zone" x="300" y="370">Кезек, worker және webhook әлі іске асырылмаған.</text></g>
